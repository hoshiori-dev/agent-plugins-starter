# Project-level Codex configuration for this repository (trusted projects only).
# Codex reads the plugin itself from plugin.json, mcp.json, and skills/ through the
# local marketplace in .agents/plugins/marketplace.json (`codex plugin marketplace add .`).
# Custom agents are not a plugin component, so each agent in com.openai/agents/ is
# declared here. Paths are relative to this file.

[plugins."agent-plugins-starter@agent-plugins-starter"]
enabled = true

[agents.example-agent]
description = "Read-only reviewer that audits an Agent Plugins package layout against the v1.0.0 specification."
config_file = "../com.openai/agents/example-agent.toml"
