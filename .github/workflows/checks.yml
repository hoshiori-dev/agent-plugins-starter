# The quality gate. Every job runs a justfile recipe that also runs locally;
# .agents/knowledge/github/checks.md maps job names to recipes. Job names are
# what rulesets require, so keep them unique across workflows.
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: checks / lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-tools
      - run: just pre-commit
  test:
    name: checks / test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-tools
      - run: just test
  plugin:
    name: checks / plugin
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-tools
      - run: just gen --check
      - run: just validate
      - run: just harness-check
  spec:
    name: checks / spec
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-tools
      - run: just spec-check
  secrets:
    name: checks / secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-tools
      - run: just secrets
  gate:
    # The aggregator: the only job a ruleset needs to require. A skipped job
    # reports success, so this job fails on failure or cancellation only.
    name: checks / gate
    if: always()
    needs: [lint, test, plugin, spec, secrets]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          if printf '%s' "$RESULTS" | grep -Eq '"result": *"(failure|cancelled)"'; then
            echo "::error::A required job failed or was cancelled. Fix that job; do not weaken this gate."
            exit 1
          fi
